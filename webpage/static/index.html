<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord to MIDI Converter</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <h1>Chord to MIDI Converter</h1>

    <form id="convert-form">
      <div class="field">
        <label for="audio">Audio file</label>
        <input type="file" id="audio" name="audio" accept="audio/*" required />
      </div>

      <div class="field">
        <label for="drums">Drums audio file (optional)</label>
        <input type="file" id="drums" name="drums" accept="audio/*" />
        <p class="hint">
          If you don't have a separate drums file, enable "Split audio" below and it will be
          extracted automatically.
        </p>
      </div>

      <div class="field">
        <label for="bpm">BPM (leave blank to auto-detect)</label>
        <input type="number" id="bpm" name="bpm" min="1" step="1" placeholder="e.g. 120" />
      </div>

      <div class="field key-field">
        <label>Key</label>
        <div class="key-selects">
          <select id="key_root" name="key_root">
            <option value="None" selected>Auto (no key)</option>
            <option value="C">C</option>
            <option value="C#">C#</option>
            <option value="D">D</option>
            <option value="D#">D#</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F#</option>
            <option value="G">G</option>
            <option value="G#">G#</option>
            <option value="A">A</option>
            <option value="A#">A#</option>
            <option value="B">B</option>
          </select>
          <select id="key_mode" name="key_mode">
            <option value="major" selected>Major</option>
            <option value="minor">Minor</option>
            <option value="harmonic_minor">Harmonic minor</option>
          </select>
        </div>
      </div>

      <div class="field toggle-field">
        <label class="switch">
          <input type="checkbox" id="quantize" name="quantize" checked />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Quantize chords to the beat grid</span>
      </div>

      <div class="field toggle-field">
        <label class="switch">
          <input type="checkbox" id="split_audio" name="split_audio" />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Split audio (separates drums automatically - slower)</span>
      </div>

      <button type="submit" id="submit-btn">Convert to MIDI</button>
    </form>

    <div id="status" class="status" hidden>
      <div class="spinner"></div>
      <span id="status-text">Processing...</span>
    </div>

    <div id="result" class="result" hidden>
      <a id="download-link" download>Download MIDI file</a>
    </div>

    <div id="error" class="error" hidden></div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
